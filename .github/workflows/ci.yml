name: Windows, Linux, and macOS

on:
  # Branch pushes from this repository are covered by their pull request;
  # only main gets a push build of its own.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Supersede stale runs of the same PR or branch; never cancel builds of main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

  msrv:
    name: MSRV (Rust 1.89)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep in sync with rust-version in Cargo.toml.
      MSRV: "1.89"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust ${{ env.MSRV }}
        run: rustup toolchain install "$MSRV" --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: msrv
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check on the minimum supported Rust version
        run: cargo "+$MSRV" check --locked --all-targets

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            extension: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            extension: .exe
          - os: macos-latest
            target: aarch64-apple-darwin
            extension: ""
    defaults:
      run:
        shell: bash
    env:
      APEX_BINARY: target/${{ matrix.target }}/release/apex-road${{ matrix.extension }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux graphics dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxi-dev \
            libgl1-mesa-dev libgl1-mesa-dri xvfb xauth

      - name: Install stable Rust
        run: >-
          rustup toolchain install stable --profile minimal
          --component clippy --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo +stable clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo +stable test --locked --all-targets --target ${{ matrix.target }}

      - name: Build release
        run: cargo +stable build --locked --release --target ${{ matrix.target }}

      - name: Validate every bundled track without a display
        run: |
          for track in tracks/*.track; do
            "$APEX_BINARY" --validate "$track"
          done

      # Windows and macOS renderer checks run separately on graphical desktops.
      - name: Smoke test the Linux renderer
        if: runner.os == 'Linux'
        timeout-minutes: 3
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          timeout 120s xvfb-run --auto-servernum --server-args="-screen 0 1440x900x24" \
            "$APEX_BINARY" --smoke-test --capture captures/ci-linux.png
          test -s captures/ci-linux.png
